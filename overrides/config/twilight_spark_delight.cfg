# Configuration file

effects {
    # 冲锋效果在疾跑或暴击攻击时可提供的最大伤害加成。
    # Maximum damage bonus from the Charge effect while sprinting or landing a critical hit. [range: 0.0 ~ 10.0, default: 0.5]
    S:chargeMaxAttackBonus=0.5

    # 冲锋效果提供的移动速度加成。
    # Movement speed bonus granted by the Charge effect. [range: 0.0 ~ 10.0, default: 0.2]
    S:chargeSpeedBonus=0.2

    # 冲锋效果提供的额外跨步高度。
    # Additional step height granted by the Charge effect. [range: 0.0 ~ 20.0, default: 5.0]
    S:chargeStepHeightBonus=5.0

    # 扩大效果的基础放大比例，1.00表示放大100%。
    # Base growth ratio for the Enlarge effect; 1.00 means 100% larger. [range: 0.0 ~ 20.0, default: 1.0]
    S:enlargeBaseScale=1.0

    # 扩大效果每个药水等级额外增加的放大比例，1.00表示每级额外放大100%。
    # Additional growth ratio per potion level for the Enlarge effect; 1.00 means 100% more growth per level. [range: 0.0 ~ 20.0, default: 1.0]
    S:enlargeScalePerLevel=1.0

    # 谜题羊奶、谜题羊奶酪以及后续随机解除负面效果食物不可解除的药水注册名。
    # Potion registry ids that cannot be removed by Quest Ram Milk / Quest Ram Cheese and later random-cure foods. [default: ]
    S:randomCureEffectBlacklist <
     >

    # 缩小效果的基础缩小比例，0.40表示缩小40%。
    # Base reduction ratio for the Shrink effect; 0.40 means 40% smaller. [range: 0.0 ~ 0.99, default: 0.4]
    S:shrinkBaseReduction=0.4

    # 缩小效果每个药水等级额外增加的缩小比例，0.10表示每级额外缩小10%。
    # Additional reduction ratio per potion level for the Shrink effect; 0.10 means 10% more reduction per level. [range: 0.0 ~ 0.99, default: 0.1]
    S:shrinkReductionPerLevel=0.1

    # 共生效果在非玩家生物上每次回复的生命值。
    # Amount of health restored each pulse by the Symbiosis effect on non-player entities. [range: 0.0 ~ 20.0, default: 1.0]
    S:symbiosisEntityHealAmount=1.0

    # 共生效果在非玩家生物上回复生命的间隔刻数。
    # Tick interval between healing pulses for the Symbiosis effect on non-player entities. [range: 1 ~ 1200, default: 100]
    I:symbiosisHealIntervalTicks=100

    # 共生效果每刻减少的基础饥饿值。
    # Base hunger drain per tick for the Symbiosis effect. [range: 0.0 ~ 1.0, default: 0.0025]
    S:symbiosisHungerDrainPerTick=0.0025

    # 共生效果在玩家身上提供的基础伤害减免比例。
    # Base damage reduction ratio granted by the Symbiosis effect on players. [range: 0.0 ~ 1.0, default: 0.1]
    S:symbiosisPlayerDamageReductionBase=0.1

    # 共生效果每级额外提供的玩家伤害减免比例。
    # Additional player damage reduction ratio per amplifier level for the Symbiosis effect. [range: 0.0 ~ 1.0, default: 0.1]
    S:symbiosisPlayerDamageReductionPerAmplifier=0.1
}


experiment250 {
    # 开启后，潜行右键生物可为试验物品250绑定生肉；增殖时使用面团代替生肉原料。
    # When enabled, sneak-right-clicking a creature binds its configured raw meat to Experiment 250, and dough replaces raw meat as the replication input. [default: false]
    B:bindingModeEnabled=false

    # 绑定模式中生物与生肉的对应关系，格式为“生物注册名=物品注册名”；可重复填写同一生物来设置按配置顺序轮换的多个物品。若目标物品未配置活性值，则按对应生物最大生命值自动生成。
    # Creature-to-raw-meat bindings used by binding mode, formatted as 'entity_registry_name=item_registry_name'; repeat an entity to define multiple items that cycle in configuration order. If the target item has no Activity cost, one is generated from the creature's maximum health.
    S:entityMeatBindings <
        minecraft:pig=minecraft:porkchop
        minecraft:cow=minecraft:beef
        minecraft:chicken=minecraft:chicken
        minecraft:sheep=minecraft:mutton
        minecraft:rabbit=minecraft:rabbit
        minecraft:spider=minecraft:spider_eye
        minecraft:zombie=minecraft:rotten_flesh
        twilightforest:wild_boar=twilight_spark_delight:raw_wild_boar_meat
        twilightforest:bighorn_sheep=twilight_spark_delight:raw_bighorn_mutton
        twilightforest:deer=twilightforest:raw_venison
        twilightforest:helmet_crab=twilight_spark_delight:hermit_crab_leg
        twilightforest:fire_beetle=twilight_spark_delight:fire_beetle_leg
        twilightforest:slime_beetle=twilight_spark_delight:slime_beetle_leg
        twilightforest:pinch_beetle=twilight_spark_delight:pinch_beetle_leg
        twilightforest:minotaur=twilightforest:raw_meef
        twilightforest:minoshroom=twilightforest:raw_meef
        twilightforest:hydra=twilightforest:hydra_chop
     >

    # 试验物品250每提升一级时，增殖生肉所获得的活性消耗减免；0.06表示每级减免6%。
    # Activity-cost discount per Experiment 250 level above level 1 when replicating raw meat; 0.06 means 6% per level. [range: 0.0 ~ 1.0, default: 0.06]
    S:experiment250ActivityDiscountPerLevel=0.06

    # 试验物品250抵消一次致死伤害所需并消耗的活性值；物品活性必须严格大于此值。
    # Activity required and consumed when Experiment 250 prevents fatal damage; the item's activity must be strictly greater than this value. [range: 0.0 ~ 1.0E8, default: 20000.0]
    S:fatalProtectionActivityCost=20000.0

    # BOSS造成的致死伤害是否允许触发试验物品250的濒死保护。
    # Whether fatal damage caused by bosses may activate Experiment 250 fatal protection. [default: true]
    B:fatalProtectionAllowsBossAttacks=true

    # BOSS攻击触发濒死保护时是否消耗本次睡眠周期的触发次数。
    # Whether fatal protection activated by a boss attack consumes a trigger for the current sleep cycle. [default: true]
    B:fatalProtectionBossAttacksConsumeTrigger=true

    # 濒死保护查找试验物品250的位置，可选 inventory、offhand 或 baubles_or_offhand。
    # Location searched for Experiment 250 fatal protection: inventory, offhand, or baubles_or_offhand. [default: inventory]
    S:fatalProtectionItemLocation=inventory

    # 这些生物造成的致死伤害触发濒死保护时不会消耗本次睡眠周期的触发次数，填写生物注册名。
    # Entity registry ids whose fatal attacks activate protection without consuming a trigger for the current sleep cycle. [default: ]
    S:fatalProtectionNonConsumingAttackers <
     >

    # 每次睡眠周期内，消耗触发次数的濒死保护最多可生效多少次。
    # Maximum fatal-protection activations that consume a trigger during each sleep cycle. [range: 0 ~ 1000, default: 3]
    I:fatalProtectionTriggersPerSleep=3

    # 可由试验物品250增殖的材料及单次增殖活性消耗，格式为“物品注册名:活性值”；已知熟肉默认不参与增殖。火腿和兔子脚的默认值分别为生猪肉和生兔肉默认值的五倍，但可以独立修改。
    # Materials replicable by Experiment 250 and their activity cost per replicated item, formatted as 'item_registry_name:activity_cost'; known cooked meats are excluded by default. Ham and Rabbit's Foot default to five times the default Porkchop and raw Rabbit costs respectively, but can be configured independently.
    S:meatActivityCosts <
        minecraft:porkchop:10
        minecraft:beef:10
        minecraft:chicken:4
        minecraft:mutton:8
        minecraft:rabbit:3
        minecraft:rabbit_foot:15
        farmersdelight:ham:50
        twilightforest:raw_venison:10
        twilightforest:raw_meef:30
        twilight_spark_delight:raw_wild_boar_meat:10
        twilight_spark_delight:raw_bighorn_mutton:8
        twilight_spark_delight:hermit_crab_leg:13
        twilight_spark_delight:fire_beetle_leg:25
        twilight_spark_delight:slime_beetle_leg:25
        twilight_spark_delight:pinch_beetle_leg:40
     >

    # 试验物品250默认增殖材料配置的迁移版本，请勿手动修改。
    # Migration version for Experiment 250's default replication materials; do not edit manually.
    I:meatDefaultsVersion=2

    # 试验物品250增殖生肉所使用的工作站，可选 cutting_board、cooking_pot 或 crafting_table。
    # Workstation used by Experiment 250 to replicate raw meat: cutting_board, cooking_pot, or crafting_table. [default: cutting_board]
    S:workstationMode=cutting_board
}


food {
    # 食用双冠冰淇淋后获得十分钟冻结效果的概率。
    # Chance for Double-Crown Ice Cream to grant ten minutes of Frosted after being eaten. [range: 0.0 ~ 1.0, default: 0.1]
    S:doubleCrownIceCreamLongFrostedChance=0.1

    # 食用双冠冰淇淋后不获得冻结效果的概率。
    # Chance for Double-Crown Ice Cream to skip the Frosted effect after being eaten. [range: 0.0 ~ 1.0, default: 0.1]
    S:doubleCrownIceCreamNoFrostedChance=0.1
}


gameplay {
    # 头戴平底锅、手持铁刀的特殊武装巨人死亡时成套掉落巨人炉灶与巨人厨锅的概率。
    # Chance for the special Skillet and Iron Knife Armored Giant to drop the Giant's Stove and Giant's Cooking Pot together. [range: 0.0 ~ 1.0, default: 0.25]
    S:armoredGiantKitchenSetDropChance=0.25

    # 武装巨人在生成时变为头戴平底锅、手持铁刀的特殊变体的概率。
    # Chance for an Armored Giant to spawn as the special Skillet and Iron Knife variant. [range: 0.0 ~ 1.0, default: 0.2]
    S:armoredGiantSkilletVariantChance=0.2

    # 实验原体在玩家进食或受伤时进行增殖的概率。
    # Chance for the Experiment Prototype to proliferate when the player eats or takes damage. [range: 0.0 ~ 1.0, default: 0.3]
    S:experimentProliferationChance=0.3

    # 额外饥饿值与饱和度区间给予的生命恢复、疾跑与挖掘加成倍率，0.25表示提升25%。
    # Benefit multiplier granted in the extended hunger and saturation range for healing, sprinting, and mining; 0.25 means 25% stronger. [range: 0.0 ~ 10.0, default: 0.25]
    S:extendedFoodExtraBenefitMultiplier=0.1

    # 开启时额外饥饿值与饱和度区间的消耗提高，并提高原版用饥饿值恢复生命、疾跑速度与挖掘速度。
    # When enabled, consumption in the extra hunger and saturation range is increased, while vanilla hunger-based healing, sprint speed, and mining speed are improved. [default: true]
    B:extendedFoodExtraConsumptionAndBenefitsEnabled=false

    # 额外饥饿值与饱和度区间的额外消耗倍率，0.50表示额外增加50%。
    # Extra consumption multiplier in the extended hunger and saturation range; 0.50 means 50% additional consumption. [range: 0.0 ~ 10.0, default: 0.5]
    S:extendedFoodExtraConsumptionMultiplier=0.0

    # 开启时玩家死亡复活后使用原版复活饥饿值与饱和度；关闭时复活后饥饿值恢复到当前扩展上限，饱和度仍使用原版复活值。
    # When enabled, respawn uses vanilla hunger and saturation values; when disabled, respawn restores hunger to the current extended cap while saturation still uses the vanilla respawn value. [default: true]
    B:extendedFoodKeepOnRespawn=true

    # 开启时额外饥饿值与饱和度上限会随暮色森林进度逐步解锁，每个指定进度各增加2点。
    # When enabled, extra hunger and saturation caps unlock gradually with Twilight Forest progression, gaining 2 points each per configured progression advancement. [default: true]
    B:extendedFoodProgressiveCapsEnabled=false

    # 是否启用扩展饥饿值与饱和度上限系统；上限最高可达40，默认随暮色森林进度逐步解锁，关闭时完全不替换玩家饥饿数据也不叠加HUD。
    # Whether to enable extended hunger and saturation caps up to 40, unlocked gradually through Twilight Forest progression by default; disabling this leaves player food data and the HUD unchanged. [default: true]
    B:extendedFoodStatsEnabled=false

    # 巨型厨锅在一次烹饪周期内最多同时制作的配方批次数。
    # Maximum recipe batches the Giant Cooking Pot processes during one cooking cycle. [range: 1 ~ 64, default: 8]
    I:giantCookingPotBatchCount=8

    # 巨人厨锅在一次烹饪周期内最多连续制作的配方批次数；实际数量仍受原料与产物堆叠上限限制。
    # Maximum recipe batches the Giant's Cooking Pot processes during one cooking cycle; actual processing is still limited by ingredients and output stack limits. [range: 1 ~ 16, default: 16]
    I:giantsCookingPotBatchCount=16

    # 巨人炉灶可同时处理的食材份数；实际数量仍受可用槽位与原料数量限制。
    # Maximum portions the Giant's Stove can process at once; actual processing is still limited by available slots and ingredients. [range: 1 ~ 16, default: 16]
    I:giantsStoveBatchCount=16

    # 荣耀坩埚完成一次酿造所需的时间（刻）；200刻为10秒。
    # Brewing time in ticks for one Glory Crucible conversion; 200 ticks equals 10 seconds. [range: 1 ~ 72000, default: 200]
    I:gloryCrucibleBrewingTimeTicks=200

    # 荣耀坩埚可容纳的最大液体量（mB）。必须为1000 mB的整数倍；无效值会向下调整到最近的有效值。
    # Maximum Glory Crucible liquid capacity in mB. It must be a multiple of 1000 mB; invalid values are rounded down to the nearest valid value. [range: 1000 ~ 64000, default: 2000]
    I:gloryCrucibleCapacityMb=2000

    # 未腌制完成的蕨菜罐被随机刻选中时增加熟成计数的基础概率；超过1.0的部分会继续判定额外阶段。
    # Base chance for an Unripe Pickled Bracken Jar to gain ripening progress on a random tick; values above 1.0 roll for extra progress. [range: 0.0 ~ 10.0, default: 0.5]
    S:pickledBrackenJarBaseRipeningChance=0.5

    # 使用转换粉转换小兔子或兔子时，将其转换为特殊杀手兔的概率；在任意空心矿山范围内时固定为100%。
    # Chance for transformation powder used on a bunny or rabbit to create a special killer rabbit; this is forced to 100% inside any hollow hill. [range: 0.0 ~ 1.0, default: 0.1]
    S:rabbitPocketWatchKillerRabbitChance=0.1

    # 方块食物分食成就需要的食客人数。
    # Required diner count for block-food sharing advancements. [range: 1 ~ 16, default: 3]
    I:twilightCheeseFondueAdvancementDinerCount=3
}


recipes {
    # 寄居蟹在砧板上用铁砧处理时，获得五个装甲碎片堆的概率。
    # Chance for a cutting board anvil process on a Helmet Crab to yield five Armor Shard Clusters. [range: 0.0 ~ 1.0, default: 0.25]
    S:hermitCrabAnvilArmorShardClusterChance=0.25

    # 寄居蟹在砧板上用铁砧处理时，额外获得三个生寄居蟹腿的概率。
    # Chance for a cutting board anvil process on a Helmet Crab to yield three extra Helmet Crab Legs. [range: 0.0 ~ 1.0, default: 0.75]
    S:hermitCrabAnvilBonusLegChance=0.75
}


