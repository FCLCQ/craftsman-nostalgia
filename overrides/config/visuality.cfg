# Configuration file

general {
    # Charge particles on charged creepers
    B:chargeEnabled=true

    # Maximum hit particles spawned per attack
    I:hitMaxAmount=20

    # Minimum hit particles spawned per attack
    I:hitMinAmount=1

    # Extra particles when entities are hit
    B:hitParticlesEnabled=true

    # Sparkles around entities wearing configured armor
    B:shinyArmorEnabled=true

    # Ambient sparkles around configured blocks
    B:shinyBlocksEnabled=true

    # Slime blob particles on landing
    B:slimeEnabled=true

    # Soul particles when walking on soul sand/soil
    B:soulEnabled=true
}


watercircle {
    # Tint water circles by biome water color
    B:colored=true

    # Water circle spawn density
    I:density=16

    # Water circle particles in rain
    B:enabled=true

    # Render water circles even if another mod already claimed the rain-ripple effect
    B:force=false
}


