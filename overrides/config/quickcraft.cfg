# Configuration file

client {
    # Color for items you already have. Hex like FF55FF55 or 55FF55. [default: FF55FF55]
    S:colorAvailable=FF55FF55

    # Color for items that will be crafted. [default: FFFFC64B]
    S:colorCrafted=FFFFC64B

    # Color of the lines linking steps. [default: FF7A7A7A]
    S:colorLines=FF7A7A7A

    # Color for missing materials. [default: FFFF5555]
    S:colorMissing=FFFF5555

    # Color for steps you have no station to craft. [default: FF5A5A5A]
    S:colorNoStation=FF5A5A5A

    # Fill color behind each step. [default: F01A1A1A]
    S:colorNodeBackground=F01A1A1A

    # Color for the item you are crafting. [default: FF4AA3FF]
    S:colorTarget=FF4AA3FF

    mobpreview {
        # Play the mob idle animation. [default: true]
        B:entityIdleAnimation=true

        # Spin the mob preview. [default: true]
        B:entitySpin=true

        # Mob preview spin speed multiplier.
        D:entitySpinSpeed=1.0

        # Play the mob walk animation. [default: false]
        B:entityWalkAnimation=false
    }

    projecte {
        # Show your total EMC in the Quick Craft header when a transmutation table or tablet is available. [default: true]
        B:showEmc=true
    }

}


general {
    # Enable Animations [default: true]
    B:animationsEnabled=true

    # Pull from, and deposit into, any item in your inventory that holds its own inventory. This is what makes 1.12.2 backpack mods such as Iron Backpacks usable as a source. [default: true]
    B:backpackSources=true

    # Items you already have enough of are not expanded into their own recipe tree. [default: true]
    B:collapseOwnedItems=true

    # Block radius around the player to pull items from and deposit results into. 0 disables nearby containers. [range: 0 ~ 64, default: 8]
    I:containerScanRange=8

    # The sound id played when a Quick Craft finishes. [default: minecraft:entity.arrow.hit_player]
    S:craftSound=minecraft:entity.arrow.hit_player

    # Play a sound when a Quick Craft finishes crafting something. [default: true]
    B:craftSoundEnabled=true

    # Craft every recipe without its crafting table or other station nearby. [default: false]
    B:craftWithoutStations=false

    # Players in creative mode craft the requested item instantly without needing or consuming any ingredients. [default: false]
    B:creativeBypass=false

    # Blocks that will not be shown as options to deposit results into. Entries can be a block id (appliedenergistics2:charger), a whole mod id (appliedenergistics2), or an OreDictionary name prefixed with @ or # (@chargers). [default: [appliedenergistics2:drive], [appliedenergistics2:controller], [appliedenergistics2:charger], [appliedenergistics2:wireless_access_point], [refinedstorage:disk_drive], [projecte:condenser_mk1], [projecte:condenser_mk2], [projecte:relay_mk1], [projecte:relay_mk2], [projecte:relay_mk3], [projecte:collector_mk1], [projecte:collector_mk2], [projecte:collector_mk3], [projecte:dm_pedestal], [projecte:dm_furnace], [projecte:rm_furnace], [@chargers]]
    S:depositBlacklist <
        appliedenergistics2:drive
        appliedenergistics2:controller
        appliedenergistics2:charger
        appliedenergistics2:wireless_access_point
        refinedstorage:disk_drive
        projecte:condenser_mk1
        projecte:condenser_mk2
        projecte:relay_mk1
        projecte:relay_mk2
        projecte:relay_mk3
        projecte:collector_mk1
        projecte:collector_mk2
        projecte:collector_mk3
        projecte:dm_pedestal
        projecte:dm_furnace
        projecte:rm_furnace
        @chargers
     >

    # Extra block or item ids to pull from and deposit into. They must expose an item inventory. [default: ]
    S:extraSources <
     >

    # Hide recipes that loop back on themselves as options unless you already have the looping item on hand. [default: false]
    B:hideLoopingRecipes=false

    # Tab bulges when hovering over it [default: true]
    B:hoverBulge=true

    # Maximum depth the crafting tree will expand to. [range: 1 ~ 128, default: 32]
    I:maxTreeDepth=32

    # Safety cap on the total number of nodes in a crafting tree. [range: 16 ~ 8192, default: 512]
    I:maxTreeNodes=512

    # Pressing the Quick Craft key on an item that has no supported recipe does nothing instead of opening an empty menu. [default: true]
    B:openOnlyWithRecipe=true

    # The pinned (bookmarked) ingredients list eases its rows in when it appears. [default: true]
    B:pinnedListAnimation=true

    # Priority list of item ids to prefer when a recipe ingredient or recipe is ambiguous. Earlier entries win, and recipes that use these items are favored. Preference is per item, so minecraft:planks covers every plank variant. [default: [minecraft:planks], [minecraft:log]]
    S:preferredItems <
        minecraft:planks
        minecraft:log
     >

    # How many items should be crafted when holding SHIFT. Accepts Max [default: 64]
    S:shiftCraftAmount=64

    # Size a tab to fit a item name [default: true]
    B:sizeTabToFit=true

    # Klein Stars carried in your inventory add their stored EMC to what Quick Craft can spend. Your own EMC is spent first, then the stars are drained. [default: true]
    B:useKleinStarEmc=true

    # When ProjectE is installed and a transmutation table is nearby or a transmutation tablet is in your inventory, use your EMC to supply missing learned materials and learn the items you craft. [default: true]
    B:useProjectEEmc=true
}


