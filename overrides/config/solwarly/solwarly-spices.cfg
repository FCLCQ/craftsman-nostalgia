    # 火热基础伤害加成比例。
    # Base Hot damage bonus.
    D:hotBase=0.1

    # 火热每级额外伤害加成比例。
    # Additional Hot damage bonus per level.
    D:hotPerLevel=0.1

    # 甜蜜每级挖掘速度加成，0.2为20%。
    # Mining speed bonus per Sweet level; 0.2 means 20%.
    D:miningPerLevel=0.2

    # 辛香基础减伤比例。
    # Base Aromatic damage reduction.
    D:reductionBase=0.1

    # 辛香每级额外减伤比例，合计最多100%。
    # Additional damage reduction per Aromatic level; total is capped at 100%.
    D:reductionPerLevel=0.05

    # 每份猎龙人粉共享本次实际饱和度和非负面药水时长的比例，不共享饥饿或已有状态。
