# Configuration file

general {
    # 初始生命心数。
    # Starting hearts.
    I:baseHearts=5

    # 不参与美食阅历统计的食物，支持通配符和子类型。
    # Foods excluded from Culinary Experience tracking; supports wildcards and metadata.
    S:foodBlacklist <
        
     >

    # 非空时美食阅历只统计白名单食物。
    # When nonempty, only listed foods count toward Culinary Experience.
    S:foodWhitelist <
        
     >

    # 显示食物兴趣和尝试记录。
    # Show food appetite and taste history.
    B:isFoodTooltipEnabled=true

    # 参与饮食统计的最低饥饿恢复值。
    # Minimum hunger restoration for dietary tracking.
    I:minimumFoodValue=1

    # 达到阅历奖励档时播放音效。
    # Play a sound when unlocking experience rewards.
    B:shouldPlayMilestoneSounds=true

    # 死亡时重置饮食统计。
    # Reset dietary progress on death.
    B:shouldResetOnDeath=false

    # 阅历奖励提示显示在快捷栏上方。
    # Show experience reward messages above the hotbar.
    B:shouldShowProgressAboveHotbar=true

    # 在食物书中显示未尝食物。
    # Show untasted foods in the Food Book.
    B:shouldShowUneatenFoods=true

    # 首次尝试食物时显示粒子。
    # Show particles when tasting a new food.
    B:shouldSpawnIntermediateParticles=true

    # 获得阅历奖励时显示粒子。
    # Show particles when unlocking experience rewards.
    B:shouldSpawnMilestoneParticles=true
}


