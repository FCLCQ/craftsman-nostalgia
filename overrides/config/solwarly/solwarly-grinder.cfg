# Configuration file

automation {
    # 正下方抽取方块注册名：阻止闲置成品弹出，并优先接收送出的原料、成品和容器；添加所用模组管道，普通容器不自动视为抽取器。
    # Registry IDs of bottom extractors: prevent idle output ejection and receive expelled ingredients, products and containers first. Add your modded pipes; ordinary containers are not automatically extractors.
    S:bottomCollectors <
        minecraft:hopper
     >
}


display {
    # 绑定配方后上方虚影切换间隔（刻），30刻为1.5秒。
    # Ticks between bound-recipe previews; 30 ticks means 1.5 seconds. [range: 1 ~ 72000, default: 30]
    I:boundPreviewTicks=30
}


