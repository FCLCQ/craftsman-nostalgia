# Configuration file

foodquality {
    # 佳肴最低原味分数，0自动确定。
    # Minimum plain score for Fine Cuisine; 0 selects automatically.
    D:cuisineMinimum=0.0

    # 珍馐最低原味分数，0自动确定。
    # Minimum plain score for Delicacies; 0 selects automatically.
    D:delicacyMinimum=0.0

    # 正餐最低原味分数，0表示按当前允许计入阅历的食物四等分自动确定；同分归同档。
    # Minimum plain score for Meals; 0 uses current eligible food quartiles. Equal scores share a tier.
    D:mealMinimum=0.0
}


preparation {
    # 索然乏味时食用贡献倍率。
    # Contribution multiplier for boring food. [range: 0.0 ~ 1000.0, default: 0.75]
    S:boringMultiplier=0.75

    # 厨锅工序权重。
    # Cooking pot process weight. [range: 0.0 ~ 1000.0, default: 1.5]
    S:cookingWeight=1.5

    # 工作台工序权重。
    # Crafting process weight. [range: 0.0 ~ 1000.0, default: 1.0]
    S:craftWeight=1.0

    # 垂涎欲滴时食用贡献倍率。
    # Contribution multiplier for craved food. [range: 0.0 ~ 1000.0, default: 1.25]
    S:cravingMultiplier=1.25

    # 砧板工序权重。
    # Cutting board process weight. [range: 0.0 ~ 1000.0, default: 1.0]
    S:cuttingWeight=1.0

    # 制作难度权重。
    # Preparation difficulty weight. [range: 0.0 ~ 1000.0, default: 0.65]
    S:difficultyWeight=0.65

    # 熔炉工序权重。
    # Furnace process weight. [range: 0.0 ~ 1000.0, default: 1.0]
    S:furnaceWeight=1.0

    # 饥饿恢复值权重，2点为一格图标。
    # Hunger weight; 2 points equal one hunger icon. [range: 0.0 ~ 1000.0, default: 0.25]
    S:hungerWeight=0.25

    # 基础系数上限，不得小于下限。
    # Maximum base coefficient, no lower than minimum. [range: 0.0 ~ 1000.0, default: 12.0]
    S:maximumCoefficient=12.0

    # 基础系数下限。
    # Minimum base coefficient. [range: 0.0 ~ 1000.0, default: 0.5]
    S:minimumCoefficient=0.5

    # 平平无奇时食用贡献倍率。
    # Contribution multiplier for ordinary food. [range: 0.0 ~ 1000.0, default: 1.0]
    S:normalMultiplier=1.0

    # 自然获取的原料入口，避免压缩/拆分配方循环。modid:item 或 modid:item@子类型；仅对无子类型物品可省略@0。
    # Naturally obtained preparation roots, preventing packing/unpacking cycles. Use modid:item or modid:item@metadata.
    S:rawSources <
        minecraft:wheat
        minecraft:melon
        minecraft:iron_ore
        minecraft:gold_ore
        minecraft:apple
        minecraft:carrot
        minecraft:potato
        minecraft:beetroot
        minecraft:porkchop
        minecraft:beef
        minecraft:chicken
        minecraft:mutton
        minecraft:rabbit
        minecraft:fish@0
        minecraft:fish@1
        minecraft:fish@2
        minecraft:fish@3
        minecraft:egg
        minecraft:milk_bucket
        minecraft:reeds
        minecraft:dye@3
        farmersdelight:onion
        farmersdelight:cabbage
        farmersdelight:tomato
        farmersdelight:rice_panicle
        minecraft:pumpkin
        minecraft:diamond
        minecraft:emerald
        minecraft:coal
        minecraft:redstone
        minecraft:quartz
        minecraft:dye@4
        minecraft:slime_ball
        minecraft:bone
        minecraft:blaze_rod
        minecraft:leather
        teastory:tea_leaf
        teastory:xian_rice
        minecraft:rotten_flesh
        minecraft:string
        minecraft:prismarine_shard
        minecraft:prismarine_crystals
     >

    # 实际饱和度恢复值权重。
    # Weight of actual saturation restored. [range: 0.0 ~ 1000.0, default: 0.095]
    S:saturationWeight=0.095

    # 分食工序权重，继承整道菜难度。
    # Serving process weight; inherits the whole dish difficulty. [range: 0.0 ~ 1000.0, default: 0.25]
    S:servingWeight=0.25

    teastory {
        # 茶风工序 cookingPan 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation cookingPan (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:cookingPan=1.75

        # 茶风工序 dryingPan 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation dryingPan (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:dryingPan=1.75

        # 茶风工序 indoorAging 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation indoorAging (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:indoorAging=1.75

        # 茶风工序 mortarGrinding 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation mortarGrinding (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:mortarGrinding=1.75

        # 茶风工序 riceWashing 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation riceWashing (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:riceWashing=1.75

        # 茶风工序 stoveDrying 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation stoveDrying (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:stoveDrying=1.75

        # 茶风工序 stoveSteam 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation stoveSteam (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:stoveSteam=1.75

        # 茶风工序 sunDrying 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation sunDrying (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:sunDrying=1.75

        # 茶风工序 teaTable 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation teaTable (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:teaTable=1.75

        # 茶风工序 waterHeating 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation waterHeating (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:waterHeating=1.75

        # 茶风工序 wetting 的权重（炒制、烘干、日晒、陈化、浸湿、焙火、蒸青、泡茶、洗米、烧水、研钵研磨）。
        # Weight of Tea the Story operation wetting (pan cooking/drying, sun drying, aging, wetting, stove drying/steam, brewing, washing rice, boiling water, mortar grinding).
        D:wetting=1.75
    }

}


rewards {
    # 累计阈值|额外生命总点数，2点为1颗心；只应用最高档。
    # Cumulative threshold|total bonus health points; 2 points = 1 heart. Highest tier only.
    S:cumulativeHealth <
        3|2
        5|4
        8|6
        10|8
        13|10
        18|12
        22|14
        27|16
        32|18
        38|20
        45|22
        52|24
        60|26
        68|28
        75|30
     >

    # 分数阈值|属性名|数值|操作(0加值,1基础比例,2乘算)。所有条目按最高分数档整组应用。
    # Score threshold|attribute name|amount|operation (0 add,1 base fraction,2 multiply). Apply all entries at the highest tier.
    S:diversityAttributes <
        5|generic.maxHealth|2|0
        10|generic.maxHealth|4|0
        15|generic.maxHealth|4|0
        15|generic.movementSpeed|0.05|2
        25|generic.maxHealth|6|0
        25|generic.movementSpeed|0.05|2
        40|generic.maxHealth|8|0
        40|generic.movementSpeed|0.10|2
        40|generic.attackDamage|1|0
     >

    # 分数阈值|药水效果注册名|等级(0为I)，与属性共享最高档。
    # Score threshold|potion registry name|amplifier (0=I); shares highest tier with attributes.
    S:diversityEffects <
     >
}


##########################################################################################################
# statistics
#--------------------------------------------------------------------------------------------------------#
# 饮食统计。多样性和兴趣黑名单在本节；阅历筛选与死亡设置见 solwarly-general.cfg。
# Dietary statistics. Diversity and appetite blacklists are below; experience filters and death settings are in solwarly-general.cfg.
##########################################################################################################

statistics {
    # 始终索然无味的食物，格式同上；与垂涎名单冲突时以此名单为准，不参与每日抽选和名额。
    # Always-boring foods, using the same ID format; take precedence over always-craved foods and do not participate in daily draws or quotas.
    S:alwaysBoringFoods <
     >

    # 始终垂涎欲滴的食物，modid:item@子类型（省略@时为0）；不参与每日抽选，不占每日名额，不绕过统计黑名单。
    # Always-craved foods, using modid:item@metadata (omitted metadata means 0); excluded from daily draws and daily quotas, without bypassing dietary filters.
    S:alwaysCravedFoods <
     >

    # 不允许成为索然无味，优先于始终无味名单；不影响垂涎欲滴。
    # Exclude foods from boring draws and override always-boring entries; craved eligibility is unchanged.
    S:boringBlacklist <
     >

    # 每天索然乏味的食物种类数。
    # Number of boring foods per day. [range: 0 ~ 1000, default: 5]
    I:boringFoods=5

    # 每天垂涎欲滴的食物种类数。
    # Number of craved foods per day. [range: 0 ~ 1000, default: 5]
    I:cravedFoods=5

    # 不允许成为垂涎欲滴，优先于始终垂涎名单；不影响索然无味。
    # Exclude foods from craved draws and override always-craved entries; boring eligibility is unchanged.
    S:cravingBlacklist <
     >

    # 同一道食物首个口味全额，后来新口味的累计收益比例；首次尝试该食物时保存。
    # Cumulative gain fraction for later new flavors; first flavor gains full value. Saved on first taste of the food. [range: 0.0 ~ 1.0, default: 0.5]
    S:cumulativeFlavorFraction=0.5

    # 仅排除多样性统计与多样性奖励，不影响美食阅历或每日兴趣抽选。
    # Exclude foods from diversity only, independently of the experience filter. Supports modid:item and * wildcards and @metadata. Existing saved meals are retained but excluded from the score; daily appetite is unaffected.
    S:diversityBlacklist <
     >

    # 多样性总分倍率。
    # Overall diversity score multiplier. [range: 0.0 ~ 100.0, default: 1.0]
    S:diversityScale=1.0

    # 只排除每日兴趣候选，不排除饮食统计；食物标识为modid:item@子类型。
    # Exclude from daily appetite selection only, not dietary statistics; IDs use modid:item@metadata.
    S:excludedDailyFoods <
     >

    # 同一道食物额外口味折算的种类数，原味也是口味。
    # Variety counted per extra flavor of one food, including plain flavor. [range: 0.0 ~ 1.0, default: 0.25]
    S:extraFlavor=0.25

    # 食用频次的额外权重倍率：-1自动使用0.43×实际每日候选食物数÷本日服务器最多统计的进食次数（排除固定兴趣食物）；其他值须非负。索然无味权重为1+次数×倍率，垂涎欲滴为其倒数。默认单人最近20次全吃同一种、约1000种候选时，每日索然无味概率约75%；0不偏向频次，1沿用原权重。
    # Extra frequency weight multiplier: -1 uses 0.43 times eligible daily candidates divided by today's server meal retention limit (excluding fixed interests); other values must be nonnegative. Boring weight is 1 + count times multiplier; craved weight is its reciprocal. With default settings, 20 identical recent meals and about 1000 candidates give roughly a 75% daily boring chance; 0 ignores frequency and 1 preserves the original weights. [range: -1.0 ~ 1000000.0, default: -1.0]
    S:frequencyWeightMultiplier=-1.0

    # 用于计算个人多样性的最近进食次数。
    # Number of recent meals used for personal diversity. [range: 2 ~ 4096, default: 32]
    I:recentMeals=32

    # 服务器最近统计进食次数的上限，下限为2。
    # Maximum recent server meals; minimum is 2. [range: 2 ~ 4096, default: 4096]
    I:serverMealLimit=4096

    # 日出在线人数乘以此值，得到服务器最近统计的进食次数。
    # Multiply online players at sunrise by this value to determine recent server meals. [range: 2 ~ 4096, default: 20]
    I:serverMealsPerPlayer=20

    # 兴趣抽选采用均匀随机的概率，其余采用频次权重。
    # Probability of uniform appetite selection; remaining draws use frequency weights. [range: 0.0 ~ 1.0, default: 0.2]
    S:uniformSelectionChance=0.2
}


warlymode {
    # 同一种料理重复递减的持续天数；睡眠推进天数，time add 不推进。
    # Days during which repeating one dish is reduced; sleeping advances days, while time add does not. [range: 1 ~ 100, default: 2]
    I:repeatDurationDays=2

    # 首次食用及随后五档重复食用的饥饿值、饱和度和本次完整多样性贡献倍率，范围大于0至1；进食耗时除以该倍率，美食阅历不变。第五次及之后重复使用最后一档。垂涎食物不递减、不计次数、不重置计时；原味和调味共用次数。
    # Multipliers greater than 0 and up to 1 for the first meal and five repeat tiers' hunger, saturation and full diversity contribution; eating duration is divided by the multiplier and Culinary Experience is unchanged. The fifth and later repeats use the last tier. Craved meals have no penalty, do not count and do not restart the timer; plain and seasoned meals share repeats.
    D:repeatMultipliers <
        1.0
        0.9
        0.8
        0.65
        0.5
        0.3
     >

    # 是否全局启用沃利模式；玩家可用指令单独覆盖。
    # Whether Warly Mode is enabled globally; players may override it with a command. [default: false]
    B:warlyMode=false
}


