# Configuration file

backport_content {
    # 高版本材料相关内容的总开关。关闭后不注册相关物品和方块；重启游戏生效。 [default: true]
    B:enableBackportContent=true

    # 启用竹橱柜和竹篮。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableBambooContent=true

    # 启用樱花木橱柜。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableCherryCabinet=true

    # 启用发光浆果蛋奶沙司和闪亮沙拉。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableGlowBerryContent=true

    # 启用蜂蜜曲奇、蜜汁火腿和闪亮沙拉。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableHoneyContent=true

    # 启用海带寿司卷、海带寿司、寿司拼盘和面条汤。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableKelpContent=true

    # 启用红树木橱柜。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableMangroveCabinet=true

    # 启用使用通用浆果矿辞的水果沙拉、填馅南瓜和蜜汁火腿。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableMixedBerryMeals=true

    # 启用绯红木橱柜、诡异木橱柜和下界沙拉。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableNetherFungusContent=true

    # 启用下界合金刀。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableNetheriteKnife=true

    # 启用甜浆果曲奇、甜浆果芝士派及切片、香烤鲑鱼。同时受总开关和涉及的其他材料开关控制；重启游戏生效。 [default: true]
    B:enableSweetBerryContent=true
}


client {
    # Should the health bar have a silver sheen when the player has the Comfort effect? [default: true]
    B:comfortHealthOverlay=true

    # Should meal and drink tooltips display which effects they provide? [default: true]
    B:foodEffectTooltip=true

    # Should the hunger bar have a gilded overlay when the player has the Nourishment effect? [default: true]
    B:nourishmentHungerOverlay=true
}


farming {
    # Which rope should Tomato Vines leave behind when mined by hand? [default: farmersdelight:rope]
    S:defaultTomatoVineRope=farmersdelight:rope

    # 破坏或替换绳上番茄时保留绳索。关闭后允许命令和区域编辑直接替换；玩家采挖仍保留绳索。 [default: true]
    B:enableTomatoRopePermanence=true

    # Should tomato vines be able to climb ropes registered through 1.12.2 OreDictionary entries fdRopes, rope or blockRope? [default: true]
    B:enableTomatoVineClimbingTaggedRopes=true

    # 允许蘑菇群落自然生长的地面方块注册 ID，可用 @元数据 限定状态。 [default: [farmersdelight:rich_soil]]
    S:mushroomColonyGrowableOn <
        farmersdelight:rich_soil
     >

    # 从上方方块底面生长的植物，沃土仅从下方促生此类植物。填写方块注册 ID，可用 @元数据 限定状态。 [default: [farmers_future_delight:cave_vines], [farmers_future_delight:cave_vines_plant]]
    S:plantedFromBelow <
        farmers_future_delight:cave_vines
        farmers_future_delight:cave_vines_plant
     >

    # 不接受沃土骨粉促生的方块注册 ID，可用 @元数据 限定状态。 [default: [minecraft:grass], [minecraft:tallgrass], [minecraft:double_plant@0], [minecraft:double_plant@1], [minecraft:double_plant@4], [minecraft:double_plant@5], [farmersdelight:sandy_shrub], [farmersdelight:brown_mushroom_colony], [farmersdelight:red_mushroom_colony], [farmersdelight:wild_cabbages], [farmersdelight:wild_onions], [farmersdelight:wild_tomatoes], [farmersdelight:wild_carrots], [farmersdelight:wild_potatoes], [farmersdelight:wild_beetroots], [farmersdelight:wild_rice], [farmers_future_delight:moss_block], [farmers_future_delight:crimson_nylium], [farmers_future_delight:warped_nylium], [farmers_future_delight:twisting_vines], [farmers_future_delight:twisting_vines_plant], [farmers_future_delight:big_dripleaf], [farmers_future_delight:big_dripleaf_waterlogged], [farmers_future_delight:big_dripleaf_stem], [suikecherry:pink_petals]]
    S:unaffectedByRichSoil <
        minecraft:grass
        minecraft:tallgrass
        minecraft:double_plant@0
        minecraft:double_plant@1
        minecraft:double_plant@4
        minecraft:double_plant@5
