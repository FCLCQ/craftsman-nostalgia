# Configuration file

cet {
    # Always check the default '_e' emissive suffix even when a pack declares a different one
    B:alwaysCheckVanillaEmissiveSuffix=true

    # Default average ticks between blinks
    # Min: 1
    # Max: 1024
    I:blinkFrequency=150

    # Default length of a blink in ticks
    # Min: 1
    # Max: 20
    I:blinkLength=1

    # DULL: OptiFine-like emissives with directional shading. BRIGHT: unshaded, brighter emissives
    # Valid values:
    # DULL
    # BRIGHT
    S:emissiveRenderMode=DULL

    # Allow armor textures to use emissive and enchanted textures
    B:enableArmorAndTrims=true

    # Enable blinking textures (texture_blink.png / texture_blink2.png)
    B:enableBlinking=true

    # Allow block entities (chests, beds, shulker boxes, banners...) to use random/custom textures
    B:enableCustomBlockEntities=true

    # Enable random/custom entity textures (OptiFine & ETF format)
    B:enableCustomTextures=true

    # Allow block entities to use emissive textures
    B:enableEmissiveBlockEntities=true

    # Enable emissive textures (texture_e.png)
    B:enableEmissiveTextures=true

    # Enable enchanted textures (texture_enchant.png)
    B:enableEnchantedTextures=true

    # Allow skin features for players on an enemy scoreboard team
    B:enableEnemyTeamPlayersSkinFeatures=true

    # Log texture variant initialization
    B:logTextureDataInitialization=false

    # OptiFine compat: allow gaps in random texture numbering when no .properties file exists
    B:optifineAllowWeirdSkipsInTrueRandom=true

    # OptiFine compat: never use a base texture placed in the OptiFine random directory
    B:optifinePreventBaseTextureInOptifineDirectory=true

    # Random property ids that are completely ignored (e.g. 'biomes', 'nbt')
    S:propertiesDisabled <
     >

    # Random property ids whose spawn-locked/updating behaviour is inverted
    S:propertyInvertUpdatingOverrides <
     >

    # Enable ETF player skin features (emissive/enchanted pixels, blinking, jacket extensions, villager nose, transparency)
    B:skinFeaturesEnabled=true

    # Which skins may render with transparency
    # Valid values:
    # VANILLA
    # ETF_SKINS_ONLY
    # ALL
    S:skinTransparencyMode=ETF_SKINS_ONLY

    # How often textures chosen by updatable properties (name, health, items...) are re-evaluated
    # Valid values:
    # Never
    # Slow
    # Average
    # Fast
    # Instant
    S:textureUpdateFrequency=Fast
}


