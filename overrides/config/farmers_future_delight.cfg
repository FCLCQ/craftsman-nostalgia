# Configuration file

##########################################################################################################
# commands
#--------------------------------------------------------------------------------------------------------#
# 函数与命令权限设置。
# Function and command permission settings.
##########################################################################################################

commands {
    # 函数允许使用的最高指令权限等级，包含原版循环函数和本模组 /schedule 调度的函数。默认 2；范围 0-4，修改后需重启。 [range: 0 ~ 4, default: 2]
    # [English] Maximum command permission level available to functions, including vanilla game-loop functions and functions scheduled by this mod's /schedule command. Defaults to 2; valid range is 0-4. Restart required.
    I:scheduledFunctionPermissionLevel=4
}


