gameplay {
    # 蜜蜂可额外用于授粉的方块或方块状态。支持 模组ID:方块ID、模组ID:方块ID@metadata、模组ID:方块ID[属性=值,属性=值] 三种格式。 [default: ]
    # [English] Additional blocks or block states that bees can pollinate. Supported formats: modid:block, modid:block@metadata, and modid:block[property=value,property=value].
    S:beeAdditionalPollinationTargets <
     >

    # 敲钟显示袭击者的范围，单位为方块。默认 48。修改后需重启游戏。 [range: 1 ~ 128, default: 48]
    # [English] Range in blocks in which ringing a bell highlights raiders. Defaults to 48. Restart required.
    I:bellRaidHighlightRange=48

    # 是否将 1.18 的八首背景音乐加入所有世界类型的生存模式与主菜单音乐池。 [default: true]
    # [English] Add the eight Minecraft 1.18 background tracks to the survival and main-menu music pools in every world type.
    B:cavesAndCliffsBackgroundMusic=true

    # 高版本云层高度的作用范围。DISABLED 关闭；CAVES_CLIFFS_ONLY 仅作用于“洞穴与山崖”世界；ALL_WORLDS 作用于所有世界类型。 [default: CAVES_CLIFFS_ONLY]
    # [English] Scope for the modern cloud height. DISABLED keeps the original height; CAVES_CLIFFS_ONLY changes only Caves & Cliffs worlds; ALL_WORLDS changes every world type.
    S:cloudHeightMode=CAVES_CLIFFS_ONLY

    # 创造模式物品栏分类。MOD_TAB 使用未世之乐专属页签；CLASSIC 按旧版原版分类放入对应页签；MODERN 使用新版分类与排列。特殊内容保留在未世之乐页签。修改后需重启游戏。 [default: MODERN]
    # [English] Creative inventory categories. MOD_TAB uses the Farmer's Future Delight tab; CLASSIC places items in the classic vanilla categories; MODERN uses modern categories and ordering. Special content appears in the Farmer's Future Delight tab. Restart required.
    S:creativeInventoryMode=MODERN

    # 连续浸水后的生物转换规则。每行填写 来源生物注册名;目标生物注册名，默认包含 minecraft:zombie;farmers_future_delight:drowned。旧版仅填写来源的条目会自动补上溺尸目标。链式转换的每一步都需要重新浸水计时，循环规则会被忽略。 [default: [minecraft:zombie;farmers_future_delight:drowned]]
    # [English] Submerged entity transformation rules, one source entity registry name;target entity registry name per line. Defaults to minecraft:zombie;farmers_future_delight:drowned. Legacy source-only entries receive the drowned target automatically. Each step in a chain requires a new submersion countdown; cyclic rules are ignored.
    S:drownedTransformationMobs <
        minecraft:zombie;farmers_future_delight:drowned
     >

    # 是否让附魔台发出 7 级方块光照。对所有世界类型生效。 [default: true]
    # [English] Make enchanting tables emit modern light level 7 in every world type.
    B:enchantingTableEmitsLight=true

    # 是否允许相同经验值的经验球按高版本规则合并，且拾取时不损失经验。对所有世界类型生效。 [default: true]
    # [English] Merge nearby experience orbs with the same value without losing experience, and pick up merged units one at a time.
    B:experienceOrbMerging=true

    # 成年山羊冲撞的基础击退力，26.3 默认值为 2.5。 [range: 0.0 ~ 16.0, default: 2.5]
    # [English] Base knockback force applied by an adult goat's ram. The 26.3 default is 2.5.
    S:goatAdultRamKnockback=2.5

    # 幼年山羊冲撞的基础击退力，26.3 默认值为 1.0。 [range: 0.0 ~ 16.0, default: 1.0]
    # [English] Base knockback force applied by a baby goat's ram. The 26.3 default is 1.0.
    S:goatBabyRamKnockback=1.0

    # 山羊两次长跳之间的最长冷却，单位为 tick；26.3 默认值为 1200。 [range: 1 ~ 72000, default: 1200]
    # [English] Maximum delay between goat long jumps, in ticks. The 26.3 default is 1200.
    I:goatLongJumpCooldownMaxTicks=1200

    # 山羊两次长跳之间的最短冷却，单位为 tick；26.3 默认值为 600。 [range: 1 ~ 72000, default: 600]
    # [English] Minimum delay between goat long jumps, in ticks. The 26.3 default is 600.
    I:goatLongJumpCooldownMinTicks=600

    # 山羊寻找长跳落点时的最大水平范围，26.3 默认值为 5 格。 [range: 1 ~ 16, default: 5]
    # [English] Maximum horizontal search range for goat long-jump landing positions. The 26.3 default is 5 blocks.
    I:goatLongJumpHorizontalRange=5

    # 山羊选定长跳落点后的准备时间，单位为 tick；26.3 默认值为 40。 [range: 0 ~ 200, default: 40]
    # [English] Preparation time after a goat selects a long-jump landing position, in ticks. The 26.3 default is 40.
    I:goatLongJumpPrepareTicks=40

    # 山羊长跳最大起跳速度相对基础跳跃强度的倍率，26.3 默认值为 3.5714288。 [range: 0.1 ~ 10.0, default: 3.5714288]
    # [English] Maximum long-jump launch velocity multiplier relative to the base jump strength. The 26.3 default is 3.5714288.
    S:goatLongJumpVelocityMultiplier=3.5714288

    # 山羊寻找长跳落点时的最大垂直范围，26.3 默认值为 5 格。 [range: 1 ~ 16, default: 5]
    # [English] Maximum vertical search range for goat long-jump landing positions. The 26.3 default is 5 blocks.
    I:goatLongJumpVerticalRange=5

    # 普通山羊两次冲撞之间的最长冷却，单位为 tick；26.3 默认值为 6000。 [range: 1 ~ 72000, default: 6000]
    # [English] Maximum delay between rams for a regular goat, in ticks. The 26.3 default is 6000.
    I:goatRamCooldownMaxTicks=6000

    # 普通山羊两次冲撞之间的最短冷却，单位为 tick；26.3 默认值为 600。 [range: 1 ~ 72000, default: 600]
    # [English] Minimum delay between rams for a regular goat, in ticks. The 26.3 default is 600.
    I:goatRamCooldownMinTicks=600

    # 山羊冲撞起跑点与目标之间的最长距离，26.3 默认值为 7 格。 [range: 1 ~ 32, default: 7]
    # [English] Maximum distance between a goat's ram starting position and its target. The 26.3 default is 7 blocks.
    I:goatRamMaxDistance=7

    # 山羊冲撞起跑点与目标之间的最短距离，26.3 默认值为 4 格。 [range: 1 ~ 32, default: 4]
    # [English] Minimum distance between a goat's ram starting position and its target. The 26.3 default is 4 blocks.
    I:goatRamMinDistance=4

    # 山羊到达起跑点后低头准备冲撞的时间，单位为 tick；26.3 默认值为 20。 [range: 0 ~ 200, default: 20]
    # [English] Time a goat lowers its head at the starting position before ramming, in ticks. The 26.3 default is 20.
    I:goatRamPrepareTicks=20

    # 山羊正式冲撞阶段的移动速度倍率，26.3 默认值为 3.0。 [range: 0.1 ~ 10.0, default: 3.0]
    # [English] Movement-speed multiplier used during the active ram. The 26.3 default is 3.0.
    S:goatRamSpeedMultiplier=3.0

    # 山羊生成或繁殖时成为尖叫山羊的基础概率，26.3 默认值为 0.02。 [range: 0.0 ~ 1.0, default: 0.02]
    # [English] Base chance for a spawned or bred goat to be a screaming goat. The 26.3 default is 0.02.
    S:goatScreamingChance=0.02

    # 成年山羊初次生成时随机缺少一只角的概率，26.3 默认值为 0.1。 [range: 0.0 ~ 1.0, default: 0.1]
    # [English] Chance for a newly spawned adult goat to be missing one random horn. The 26.3 default is 0.1.
    S:goatSingleHornChance=0.1

    # 是否要求自然生成的敌对生物所在位置方块光照必须为 0。对所有世界类型生效，不影响刷怪笼。 [default: true]
    # [English] Require block light level 0 for natural hostile mob spawning in every world type. Mob spawners are not affected.
    B:hostileMobsRequireZeroBlockLight=true

    # 是否让灾厄村民不再主动攻击或伤害幼年村民。对所有世界类型生效。 [default: true]
    # [English] Prevent illagers from targeting or damaging baby villagers in every world type.
    B:illagersIgnoreBabyVillagers=true

