# Configuration file

hacks {
    # TickCentral has a buggy ASM transformer - this will disable these mixins from being applied. Make sure bubble columns are disabled if you use this. [default: false]
    B:DisableBlockUpdateMixins=false

    # Enable overwriting skybox renderer height, vanilla one may cause weird black edges near the chunk border. [default: false]
    B:EnableSkyBoxHeightOverwrite=false
}


