name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成轻量包
        run: python3 tools/build_pack.py --out dist --version "${GITHUB_REF_NAME#v}"
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pack
          path: dist/*
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
